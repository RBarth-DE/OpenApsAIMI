# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
#org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
# org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.warning.mode=all
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:ReservedCodeCacheSize=512m
# More workers ? set to ~half your physical cores
org.gradle.workers.max=4
# Build cache ? you probably want this on locally
org.gradle.caching=true
# Configuration cache ? your comment says CircleCI issues, but locally it's fine
# Enable it here, disable it in your CI environment variable instead
org.gradle.configuration-cache=true

kotlin.daemon.jvm.options=-Xmx4g -XX:MaxMetaspaceSize=512m

android.enableJetifier=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# Cache is causeing issues with CircleCI nad maybe Studio 2021
# org.gradle.unsafe.configuration-cache=true

android.nonFinalResIds=true

ksp.incremental=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
